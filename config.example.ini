# Config Signer. Signer đọc lúc khởi động; section [key:…] nạp lại được bằng kill -HUP <pid> (Linux).
# File chứa IP được phép và hạn mức của từng key: giữ quyền 600, cùng chủ với keystore.
# config-set / config-edit ghi lại cả file nên comment bị mất; generate / import / remove
# chỉ thêm / xoá section của key đó. IP, symbol, hạn mức trong section: sửa tay.

[server]
keystore = /var/lib/signer/keystore.json
host = 0.0.0.0
port = 8080
# mainnet | testnet. Bảng asset (signer/hyperliquid_assets.ini) hiện chỉ có mainnet
hyperliquid_network = mainnet
# Độ lệch tối đa của timestamp / nonce so với giờ Signer
max_payload_age_ms = 60000

# Mỗi key một section, generate / import tự thêm. Không có section → key không ký được gì.
#   allowed_ips   IP của BE được gọi bằng key này, cách nhau bằng dấu phẩy. Key mới: để trống, phải điền tay
#   max_leverage  đòn bẩy tối đa
#   <symbol> = <max_qty>  symbol được ký và khối lượng tối đa của một lệnh (so sánh <).
#     Binance: tên đầy đủ (BTCUSDT, BTCUSDC…). Hyperliquid: <COIN>USDC, phải có trong hyperliquid_assets.ini.
#   Lệnh reduce-only không bị giới hạn khối lượng.

[key:3f2b8c1e-6d4a-4f7b-9c2e-1a5d8e7f0b34]
allowed_ips = 10.0.1.12, 10.0.1.13
max_leverage = 40
BTCUSDT = 0.1
BTCUSDC = 0.1

[key:a91d4e7c-2b38-4c55-8f0a-6e3b9d1c7f22]
allowed_ips = 10.0.1.12
max_leverage = 40
BTCUSDC = 0.1
ETHUSDC = 1
